<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>m-dash README brand header</title>
<link rel="stylesheet" href="../../src/brand/fonts-hybrid-local.css">
<link rel="stylesheet" href="../../src/brand/fonts-product-local.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d12; }
  #header { width: 1100px; padding: 44px 48px 46px; color: #eef2f6; background: #10151d; border-bottom: 3px solid #22d3ee; }
  .identity { display: flex; align-items: center; gap: 20px; }
  .hybrid { font-family: 'CND Hybrid Display'; font-weight: 400; font-synthesis: none; }
  .icon { display: grid; place-items: center; flex-shrink: 0; width: 90px; height: 90px; font-size: 48px; line-height: 1.3; border: 1px solid #2e3846; border-radius: 5px; background: #191f29; }
  .name { font-size: 83px; line-height: 1.3; margin: 0; }
  .monogram { margin-left: auto; width: 112px; height: 84px; object-fit: contain; filter: invert(1) hue-rotate(180deg); }
  h1 { margin: 24px 0 8px; font-size: 72px; line-height: 1.3; }
  p { margin: 0; font: 20px/1.5 Geist, sans-serif; color: #aab5c3; }
</style>
<header id="header">
  <div class="identity">
    <span class="icon hybrid" aria-hidden="true">M-</span>
    <span class="name hybrid">m-dash</span>
    <img class="monogram" src="../../src/brand/cnd-monogram-hybrid-transparent.png" alt="CND monogram">
  </div>
  <h1 class="hybrid">Know what's left.</h1>
  <p>AI allowances, credits, and resets. Local to your desktop.</p>
</header>
</html>
