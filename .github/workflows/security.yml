name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Hosted scans run automatically only on the public repository; the private archive can still dispatch them.
  dependencies:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: RustSec advisories for every Rust lockfile
        run: |
          cargo install cargo-audit --locked
          for lock in src-tauri/Cargo.lock sync-core/Cargo.lock mobile/src-tauri/Cargo.lock; do
            echo "::group::$lock"
            cargo audit --file "$lock"
            echo "::endgroup::"
          done
      - name: npm advisories for every npm lockfile
        run: |
          npm audit --package-lock-only --audit-level=moderate
          npm audit --package-lock-only --audit-level=moderate --prefix relay

  secrets:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history with a checksum-verified Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  codeql:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript, actions
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
