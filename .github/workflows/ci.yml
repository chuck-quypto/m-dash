name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  # Hosted CI runs automatically only on the public repository; the private archive can still dispatch it.
  web:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Typecheck and build the desktop and mobile frontends
        run: |
          npm run build
          npm run mobile:build
      - run: npm run mobile:test
      - name: Relay tests
        working-directory: relay
        run: |
          npm ci
          npm test
      - name: Release script and documentation checks
        run: |
          node --test scripts/windows-rc.test.mjs scripts/linux-rc.test.mjs scripts/mac-rc.test.mjs scripts/release-notes.test.mjs
          node scripts/check-release-docs.mjs

  rust:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve canonical source and notice bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev libdbus-1-dev
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            sync-core
      # The desktop crate embeds the built frontend.
      - run: npm ci
      - run: npm run build
      - name: Formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path sync-core/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --test-threads=1
          cargo test --manifest-path sync-core/Cargo.toml --locked

  dco:
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a Developer Certificate of Origin sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $commit has no Signed-off-by line. See CONTRIBUTING.md#sign-your-commits-dco."
              missing=1
            fi
          done
          exit $missing
