name: Provider breakage
description: A provider reading stopped working or looks wrong, often after a CLI or API update.
labels: [provider]
body:
  - type: markdown
    attributes:
      value: |
        See docs/PROVIDERS.md for how each provider is read. Redact account identifiers, emails, organization names and keys.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Codex, Claude, Claude local feed, Grok, OpenRouter]
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: Provider CLI version
      description: Output of `codex --version`, `claude --version` or `grok --version`. Not needed for OpenRouter.
  - type: input
    id: version
    attributes:
      label: m-dash version and platform
      placeholder: 0.5.0 on macOS 15.4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What m-dash shows, and what the provider shows
      description: Include the error text from the dashboard or Settings, and when the reading last worked.
    validations:
      required: true
