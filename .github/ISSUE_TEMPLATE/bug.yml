name: Bug report
description: Something in m-dash doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Redact account emails, organization names, keys, pairing codes and database contents from everything you paste or attach.
        For a security problem, use the private route in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: m-dash version
      placeholder: 0.5.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows x64, macOS Apple Silicon, Linux (source build), Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: Windows 11 24H2, macOS 15.4, Ubuntu 26.04
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable ...
        2. Click ...
  - type: textarea
    id: logs
    attributes:
      label: Error text or redacted screenshot
